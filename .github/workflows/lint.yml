name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (eslint, prettier, svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: eslint + prettier
        working-directory: frontend
        run: npm run lint

      - name: svelte-check
        working-directory: frontend
        run: npm run check

  backend:
    name: Backend (clippy, rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # rust-embed reads frontend/build at compile time, so clippy needs a
      # real build present even though this job doesn't lint the frontend.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
