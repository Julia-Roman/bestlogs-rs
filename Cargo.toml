[package]
name = "bestlogs-rs"
version = "0.1.0"
edition = "2024"
default-run = "bestlogs-rs"

[features]
# Builds `src/bin/fanout_bench.rs`, a load-generator for the log fan-out that
# stands up local TLS mock instances. Off by default so neither `cargo build`
# nor the Nix build pays for it.
bench = ["dep:tokio-rustls"]

[[bin]]
name = "fanout-bench"
path = "src/bin/fanout_bench.rs"
required-features = ["bench"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dashmap = "6.2.1"
futures = "0.3.34"
indexmap = { version = "2.14.1", features = ["serde"] }
moka = { version = "0.12.16", features = ["future"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "query"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", optional = true }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-full", "cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
