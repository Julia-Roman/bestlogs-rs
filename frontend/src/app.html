<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so there's no flash of the wrong theme.
			// Defaults to dark unless the visitor has stored a preference or their
			// system explicitly prefers light.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark';
					if (theme === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		<!-- Matches app.css's --color-canvas so the correct background paints
		     immediately, before the bundled stylesheet or web font finish loading. -->
		<style>
			html {
				background: #f7f7fb;
			}
			html.dark {
				background: #0a0a0f;
			}
		</style>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<!-- Non-blocking: loads the font without holding up first paint. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			onload="
				this.onload = null;
				this.rel = 'stylesheet';
			"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			/>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
